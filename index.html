<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flood Rescue Robot</title>
    <!-- 1. Load Blockly -->
    <script src="js/blockly.min.js"></script>
    
    <!-- 2. CSS Styling -->
     <link rel="stylesheet" href="res/myStylesheet.css" type="text/css">
    <style>

    </style>
</head>
<body>

    <div id="app-container">
        <div id="controls-section">
            <div id="blocklyDiv"></div>
            <button class="run-btn" onclick="runCode()">Run Program</button>
        </div>

        <div id="game-section">
            <div id="game-board">
                <div id="robot"></div>
            </div>
        </div>
        <div id="game-modal" class="modal-overlay hidden">
            <div class="modal-card">
                <h2 id="modal-title">Mission Brief</h2>
                <p id="modal-message">Deliver the emergency supplies to the survivor station.</p>
                <button id="modal-btn" onclick="closeModal()">Start Delivery</button>
            </div>
        </div>
    </div>

    <!-- Hidden Toolbox XML for Blockly -->
    <xml id="toolbox" style="display: none">
        <block type="robot_step"></block>
        <block type="robot_turn"></block>
        <block type="robot_drop"></block>
    </xml>

    <xml id="startBlocks" style="display: none">
        <block type="robot_start" deletable="false" movable="false" x="50" y="50"></block>
    </xml>

    <!-- 3. JavaScript Logic -->
    <script src="js/level.js"></script>
    <script src="js/message.js"></script>
    <script src="js/engine.js"></script>
</body>
</html>
